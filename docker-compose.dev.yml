# ============================================================================
# Vrodux ERP — Development Docker Compose
# Local development with hot-reload. API and Web run on host.
# ============================================================================

services:
  # ── SQL Server 2022 ───────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vrodux-dev-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "VroduxDev@2026!"
      MSSQL_PID: "Express"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - dev-sqlserver-data:/var/opt/mssql/data
      - dev-sqlserver-log:/var/opt/mssql/log
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "VroduxDev@2026!" -C -Q "SELECT 1" -b -o /dev/null
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vrodux-dev-redis
    command: redis-server --requirepass "devredis123"
    volumes:
      - dev-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: redis-cli -a "devredis123" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Seq (Structured Logging) ──────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: vrodux-dev-seq
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - dev-seq-data:/data
    ports:
      - "5341:80"
    restart: unless-stopped

volumes:
  dev-sqlserver-data:
  dev-sqlserver-log:
  dev-redis-data:
  dev-seq-data:
