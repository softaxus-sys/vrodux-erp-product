# ============================================================================
# Vrodux ERP — Staging Docker Compose
# Full stack matching production, using staging images + relaxed limits
# ============================================================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vrodux-stage-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
      MSSQL_PID: "Express"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - stage-sqlserver-data:/var/opt/mssql/data
      - stage-sqlserver-log:/var/opt/mssql/log
      - ./docker/sqlserver/mssql.conf:/var/opt/mssql/mssql.conf:ro
    ports:
      - "127.0.0.1:1434:1433"
    networks:
      - vrodux-stage
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

  redis:
    image: redis:7-alpine
    container_name: vrodux-stage-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - stage-redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - vrodux-stage
    restart: unless-stopped
    healthcheck:
      test: redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 15s
      timeout: 5s
      retries: 3

  seq:
    image: datalust/seq:latest
    container_name: vrodux-stage-seq
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - stage-seq-data:/data
    ports:
      - "127.0.0.1:5342:80"
    networks:
      - vrodux-stage
    restart: unless-stopped

  vrodux-api:
    image: ghcr.io/${GITHUB_REPOSITORY:-vrodux/erp}/vrodux-api:${IMAGE_TAG:-staging}
    container_name: vrodux-stage-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__IdentityDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__POSDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__InventoryDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__SalesDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__PurchaseDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__HrDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__FinanceDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__CrmDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__ConstructionDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__RealEstateDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__HospitalityDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__RestaurantDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__RecipeDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__ProjectManagementDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__AiAssistantDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      ConnectionStrings__VisaDb: "Server=vrodux-stage-sqlserver;Database=SoftaxisErpDb_Staging;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=False;"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "Softaxis.Identity.API"
      Jwt__Audience: "Softaxis.ERP.Clients"
      AllowedOrigins__0: "https://staging.${DOMAIN}"
      FrontendUrl: "https://staging.${DOMAIN}"
      Seq__Url: "http://vrodux-stage-seq"
      Redis__ConnectionString: "vrodux-stage-redis:6379,password=${REDIS_PASSWORD},abortConnect=false"
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - vrodux-stage
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: curl -sf http://localhost:8080/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  vrodux-web:
    image: ghcr.io/${GITHUB_REPOSITORY:-vrodux/erp}/vrodux-web:${IMAGE_TAG:-staging}
    container_name: vrodux-stage-web
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - vrodux-stage
    restart: unless-stopped
    healthcheck:
      test: wget -qO- http://localhost:3000/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  stage-sqlserver-data:
  stage-sqlserver-log:
  stage-redis-data:
  stage-seq-data:

networks:
  vrodux-stage:
    name: vrodux-stage
    driver: bridge
