# ============================================================================
# Vrodux ERP — Redis Production Configuration
# ============================================================================

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Security — password set via requirepass (injected from env in compose)
# requirepass is set via --requirepass flag in docker-compose

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence — AOF + RDB
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB compression
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Logging
loglevel notice
logfile ""

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client limits
maxclients 256

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
