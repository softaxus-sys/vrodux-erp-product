# ============================================================================
# Vrodux ERP — Prometheus Configuration
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# ── Alert Rules ────────────────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/alert_rules.yml"

# ── Scrape Targets ─────────────────────────────────────────────────────────
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # Node Exporter (host metrics: CPU, memory, disk, network)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["vrodux-node-exporter:9100"]
        labels:
          service: "host"
          instance: "contabo-vps"

  # cAdvisor (container metrics)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["vrodux-cadvisor:8080"]
        labels:
          service: "containers"
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: compose_service

  # Docker Engine metrics
  - job_name: "docker"
    static_configs:
      - targets: ["host.docker.internal:9323"]
        labels:
          service: "docker-engine"

  # Vrodux API (.NET metrics endpoint — if configured)
  - job_name: "vrodux-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["vrodux-api:8080"]
        labels:
          service: "vrodux-api"
          module: "gateway"
    # Fail gracefully if /metrics is not exposed
    scrape_interval: 30s
    honor_labels: true

  # Redis Exporter (optional — add redis_exporter container if needed)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # Nginx stub_status (optional — requires nginx stub_status module)
  # - job_name: "nginx"
  #   static_configs:
  #     - targets: ["vrodux-nginx:8081"]
