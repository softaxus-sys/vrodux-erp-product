# ============================================================================
# Vrodux ERP — Grafana Datasources (auto-provisioned)
# ============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://vrodux-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST

  - name: Loki
    type: loki
    access: proxy
    url: http://vrodux-loki:3100
    editable: false
    jsonData:
      maxLines: 1000
