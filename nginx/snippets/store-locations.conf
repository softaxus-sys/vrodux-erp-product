# Shared by every store server block (see conf.d/stores.conf.example). Not a server block by itself, so it is safe to ship.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# The store API. Never cached: the generic API rule caches anonymous GETs for 5 minutes and only skips requests carrying
# Authorization — a signed-in shopper is identified by X-Shop-Token, so caching would hand one shopper's account to another.
location ^~ /api/ecommerce/shop/ {
    limit_req zone=api_rate burst=120 nodelay;
    limit_conn conn_limit 100;
    proxy_pass http://vrodux_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# Which store is this address? (called once per page load by the SPA)
location = /api/ecommerce/shop-host {
    limit_req zone=api_rate burst=30 nodelay;
    proxy_pass http://vrodux_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_cache off;
}

# Nothing else of the ERP's API is reachable through a store's address.
location /api/ { return 404; }

location / {
    limit_req zone=general_rate burst=100 nodelay;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend http://vrodux-web:3000;
    proxy_pass $frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}
