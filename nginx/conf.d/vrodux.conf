# ============================================================================
# Vrodux ERP — Site Configuration
# Replace ${DOMAIN} with your actual domain (e.g., erp.vrodux.com)
# ============================================================================

# ── Health Check (internal) ────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS (except health + ACME)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS Server ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Replace with your actual domain
    server_name erp.vrodux.com;

    # ── SSL Configuration ──────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/erp.vrodux.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.vrodux.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/erp.vrodux.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ───────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── API Backend (/api/*) ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_rate burst=60 nodelay;
        limit_conn conn_limit 100;

        proxy_pass http://vrodux_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 5m;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Auth Endpoints (stricter rate limit) ───────────────────────────────
    location /api/auth/ {
        limit_req zone=auth_rate burst=10 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://vrodux_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_cache off;
    }

    # ── Health Check (public) ──────────────────────────────────────────────
    location = /health {
        proxy_pass http://vrodux_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # ── SignalR / WebSocket ────────────────────────────────────────────────
    location /hubs/ {
        proxy_pass http://vrodux_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        proxy_cache off;
        proxy_buffering off;
    }

    # ── Hangfire Dashboard (protected) ─────────────────────────────────────
    location /hangfire {
        proxy_pass http://vrodux_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── Scalar API Docs (dev/staging only — block in prod if desired) ─────
    location /scalar/ {
        proxy_pass http://vrodux_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # ── Seq (Structured Logging UI) — dynamic resolve, optional ─────────
    location /seq/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $seq http://vrodux-seq:80;
        proxy_pass $seq/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── Grafana (monitoring) — dynamic resolve, optional ─────────────────
    location /grafana/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana http://vrodux-grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Frontend (SPA — catch-all, must be LAST) ──────────────────────────
    location / {
        limit_req zone=general_rate burst=100 nodelay;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend http://vrodux-web:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Return friendly message if frontend is not deployed yet
        proxy_intercept_errors on;
        error_page 502 = @no_frontend;
    }

    location @no_frontend {
        default_type application/json;
        return 200 '{"status":"API is running","message":"Frontend not deployed yet","api":"https://erp.vrodux.com/health"}';
    }

    # ── Error Pages ────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
