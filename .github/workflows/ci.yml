# ============================================================================
# Vrodux ERP — CI Pipeline (Pull Requests)
# Runs on every PR to main: restore, build, test, lint
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── Backend Build & Test ────────────────────────────────────────────────
  backend:
    name: Backend (Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Softaxis.ERP.slnx

      - name: Build
        run: dotnet build Softaxis.ERP.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Softaxis.ERP.slnx -c Release --no-build --verbosity normal
        continue-on-error: true

  # ── Frontend Build & Lint ───────────────────────────────────────────────
  frontend:
    name: Frontend (Build & Type Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FrontendVite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: FrontendVite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: "https://erp.vrodux.com"

  # ── Docker Build Test ──────────────────────────────────────────────────
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (test only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          tags: vrodux-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image (test only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          tags: vrodux-web:test
          build-args: |
            VITE_API_URL=https://erp.vrodux.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
